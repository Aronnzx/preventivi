/* Layout: app a schermo intero — fascia blu della carta intestata in alto, contenuto che scorre, tab in basso; editor in tre passi sopra. */
:root{
  --navy:#2A3379; --navy-deep:#1C2260; --on-navy:#FFFFFF;
  --paper:#F4F5FA; --card:#FFFFFF; --ink:#171C3D; --muted:#5F6584; --line:#DDE0EC;
  --accent:#2F3A9E; --accent-soft:#E8EAF7;
  --ok:#1C7F54; --ok-soft:#E1F3EA; --warn:#9A6410; --warn-soft:#FBF0DC; --bad:#B53A33; --bad-soft:#FBE6E4; --wa:#1A8F4E;
  --f-display:"Crimson Pro","Times New Roman",Georgia,serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#232A68; --navy-deep:#151A45; --on-navy:#FFFFFF;
  --paper:#0E1124; --card:#171B33; --ink:#E8EAF6; --muted:#9BA1C0; --line:#2A3052;
  --accent:#9AA6FF; --accent-soft:#232A55;
  --ok:#4CC38A; --ok-soft:#14301F; --warn:#E3AE55; --warn-soft:#33270F; --bad:#F07C74; --bad-soft:#3A1A18; --wa:#3DCB7A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#232A68; --navy-deep:#151A45; --on-navy:#FFFFFF;
  --paper:#0E1124; --card:#171B33; --ink:#E8EAF6; --muted:#9BA1C0; --line:#2A3052;
  --accent:#9AA6FF; --accent-soft:#232A55;
  --ok:#4CC38A; --ok-soft:#14301F; --warn:#E3AE55; --warn-soft:#33270F; --bad:#F07C74; --bad-soft:#3A1A18; --wa:#3DCB7A;
  color-scheme:dark}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

#app{height:100%;display:grid;grid-template-rows:1fr auto}
main{overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}

.hero-in{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:22px 16px 20px}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.hero h1{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:34px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin-top:4px}
.hero .rule{height:1px;background:rgba(255,255,255,.35);margin:14px 0 12px}
.hero .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .stats span{display:block;font-size:12.5px;opacity:.8}
.hero .stats b{font-family:var(--f-display);font-style:italic;font-size:26px;font-weight:700;line-height:1.1}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.page-head h1{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:32px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line)}
.tabs button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:14px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:4px;padding-right:4px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px}
.icon-btn{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn[disabled]{opacity:.3}

.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-family:var(--f-display);font-style:italic;font-size:22px;font-weight:700;text-align:right;line-height:1.1}
.pill{justify-self:end;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--muted)}
.pill.inviato{background:var(--warn-soft);color:var(--warn)}
.pill.accettato{background:var(--ok-soft);color:var(--ok)}
.pill.rifiutato{background:var(--bad-soft);color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px}
.banner .grow{flex:1;min-width:170px}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:center;gap:10px}
.card-head .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.card-head h2{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:24px;flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2.stack{grid-template-columns:1fr}}

/* Editor */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--navy);color:var(--on-navy)}
.sheet-head .icon-btn{color:var(--on-navy)}
.sheet-head .ttl{flex:1;min-width:0}
.sheet-head .ttl span{font-size:12px;opacity:.75;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.sheet-head .ttl b{font-family:var(--f-display);font-style:italic;font-size:23px;display:block;line-height:1.05}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.sheet-foot .tot{flex:1;min-width:0}
.sheet-foot .tot b{font-family:var(--f-display);font-style:italic;font-size:28px;line-height:1;display:block}
.unsaved{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;font-size:14px}

.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.quick button:hover{border-color:var(--accent)}
.quick button.flash{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.quick button.other{border-style:dashed;color:var(--accent)}

.voce{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.vtop{display:flex;gap:2px;align-items:center}
.vtop input{font-weight:700;background:transparent;border-color:transparent;padding:6px 8px;font-size:17px}
.vtop input:hover{border-color:var(--line)}
.voce textarea{font-size:14px;padding:8px 10px;color:var(--muted)}
.vnums{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.vnums.noprice{grid-template-columns:1fr auto}
.vnums .field>span{font-size:12px}
.qty{display:flex}
.qty input{border-radius:12px 0 0 12px;text-align:right}
.qty input{padding-left:6px;padding-right:8px}.qty .um{flex:none;min-width:70px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;padding:0 10px;cursor:pointer;white-space:nowrap}
.vnums input[data-f="prezzo"]{text-align:right}
.imp{text-align:right;padding-bottom:10px}
.imp span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.imp b{font-size:17px;white-space:nowrap}
.calc{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.calc .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .g4 input{padding:9px 8px;text-align:right}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:auto;accent-color:var(--navy)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,24,60,.15)}
.bigin{position:relative}
.bigin input{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:30px;padding:10px 14px 10px 40px;text-align:right}
.bigin i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:22px;color:var(--muted)}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:15px}
.sum .r{text-align:right}
.sum .big{font-family:var(--f-display);font-style:italic;font-size:30px;font-weight:700}
.sum hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.inline{display:flex;gap:6px;align-items:center}
.inline input{width:76px;padding:7px 8px;text-align:right}
details.more{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.more summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:20px;line-height:1;color:var(--accent)}
details.more[open] summary::after{content:"–"}
details.more .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}

.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,35,.55);display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.mbox h3{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:26px}
@media (min-width:600px){.modal{align-items:center}.mbox{border-radius:20px}}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-weight:700}
.step p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.step .act{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.listino-row{display:grid;grid-template-columns:1fr 86px 86px 40px;gap:6px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.listino-row input,.listino-row select{padding:9px}
.listino-row .pz{text-align:right}
.listino-desc{grid-column:1/-1;font-size:14px}
.home-tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.home-tip svg{width:30px;height:30px;color:var(--accent)}
.home-tip ol{margin:6px 0 0;padding-left:18px;font-size:15px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.mbox{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}.quick button{transition:background .2s,border-color .2s}}
</style>

</head>
<body>
<div id="app">
  <main id="main"></main>
  <nav class="tabs" aria-label="Sezioni">
    <button data-act="tab" data-v="preventivi" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Preventivi</button>
    <button data-act="tab" data-v="clienti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.4-6.5 8-6.5s7 2 8 6.5"/></svg>Clienti</button>
    <button data-act="tab" data-v="listino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="14" height="7" rx="1.5"/><path d="M17 7.5h2.5v5H11V16"/><rect x="9.5" y="16" width="3" height="5" rx="1"/></svg>Listino</button>
  </nav>
</div>
<section id="editor" class="sheet" hidden></section>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- utilità ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>{try{return crypto.randomUUID().replace(/-/g,"").slice(0,20)}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}};
const clone=o=>JSON.parse(JSON.stringify(o));
function fmtNum(n,d=2){n=+n||0;const neg=n<0;let [i,f]=Math.abs(Math.round(n*100)/100).toFixed(d).split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g,".");return (neg?"-":"")+i+(d?","+f:"")}
const money=n=>"€ "+fmtNum(n);
function fmtQty(n){n=+n||0;const r=Math.round(n*100)/100;return Number.isInteger(r)?fmtNum(r,0):fmtNum(r,2).replace(/,?0$/,"")}
function num(v){v=String(v??"").trim().replace(/\s|€/g,"");if(!v)return 0;if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");const n=parseFloat(v);return isFinite(n)?n:0}
const inVal=n=>(n===0||n==null||n==="")?"":String(Math.round(n*100)/100).replace(".",",");
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayISO=()=>isoOf(new Date());
function dIT(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+(+n||0));return isoOf(d)}
function waNumber(t){let d=String(t||"").replace(/\D/g,"");if(!d)return "";if(d.startsWith("00"))d=d.slice(2);if(d.length<=10&&/^3/.test(d))d="39"+d;return d}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

const STATI=[["bozza","Bozza"],["inviato","Inviato"],["accettato","Accettato"],["rifiutato","Rifiutato"]];
const UM=["mq","ml","cad","a corpo","ore"];
const DEFAULT_CONFIG={
  azienda:{nome:"Argese Decorazioni"},firma:"Argese Decorazioni",sigla:"",ivaDefault:22,validita:30,
  condizioni:"Prezzi comprensivi di materiali, manodopera e protezioni. Pagamento: 30% all'accettazione, saldo a fine lavori. Lavori extra non indicati saranno concordati a parte. Le quantità sono stimate da sopralluogo e verranno verificate a misura a fine lavori.",
  listino:[
    {id:"cop",nome:"Protezioni e coperture",descr:"Copertura di pavimenti, mobili e infissi con teli e nastro",um:"mq",prezzo:1.5},
    {id:"ras",nome:"Raschiatura e pulizia",descr:"Rimozione di parti incoerenti e vecchia pittura",um:"mq",prezzo:3},
    {id:"stu",nome:"Stuccatura crepe e fori",descr:"Apertura e stuccatura di crepe, fori e imperfezioni",um:"ml",prezzo:6},
    {id:"rsg",nome:"Rasatura",descr:"Rasatura a stucco in due mani e carteggiatura finale",um:"mq",prezzo:10},
    {id:"fis",nome:"Fissativo",descr:"Applicazione di fissativo isolante acrilico",um:"mq",prezzo:2},
    {id:"pit",nome:"Pittura traspirante",descr:"Idropittura traspirante, due mani a rullo",um:"mq",prezzo:6.5},
    {id:"lav",nome:"Pittura lavabile",descr:"Idropittura lavabile, due mani",um:"mq",prezzo:8},
    {id:"muf",nome:"Trattamento antimuffa",descr:"Sanificazione e pittura antimuffa, due mani",um:"mq",prezzo:9},
    {id:"sma",nome:"Smaltatura porte / termosifoni",descr:"Carteggiatura, fondo e smalto",um:"cad",prezzo:60},
    {id:"dec",nome:"Effetto decorativo",descr:"Finitura decorativa o materica a scelta del cliente",um:"mq",prezzo:30},
    {id:"est",nome:"Tinteggiatura esterni",descr:"Pittura silossanica per esterni, due mani",um:"mq",prezzo:16},
    {id:"pul",nome:"Pulizia finale e smaltimento",descr:"Pulizia del cantiere e smaltimento dei materiali",um:"a corpo",prezzo:120}
  ]
};

/* ---------- stato ---------- */
const S={view:"preventivi",q:"",qc:"",filtro:"tutti",clienti:[],preventivi:[],config:null,ready:false,ed:null,dirty:false,cfgDraft:null,share:null};
const cfg=()=>{const c=S.config||{};return {...clone(DEFAULT_CONFIG),...c,azienda:{...DEFAULT_CONFIG.azienda,...(c.azienda||{})},listino:c.listino||clone(DEFAULT_CONFIG.listino)}};

/* ---------- archivio: online (db) o su questo dispositivo ---------- */
const IS_PWA=document.documentElement.dataset.pwa==="1";
const IS_STANDALONE=(()=>{try{return window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches}catch(e){return false}})();
const LKEY="argese_prev_local_v1",DKEY="argese_prev_draft_v1";
const Store={mode:"local",db:null,downloads:null,local:{clienti:{},preventivi:{},config:null},
  async init(){
    if(!IS_PWA)for(let i=0;i<15&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
    const c=IS_PWA?null:window.claude;
    if(c&&typeof c.use==="function"){
      const safe=p=>Promise.resolve(p).catch(()=>null);
      const [db,downloads]=await Promise.all([safe(c.use("db")),safe(c.use("downloads"))]);
      this.downloads=downloads;
      if(db){this.db=db;this.mode="db";this.listen();return}
    }
    const l=lsGet(LKEY);if(l)this.local=l;
    this.pushLocal();S.ready=true;render();
  },
  listen(){
    let n=0;const done=()=>{if(++n>=3)S.ready=true;if(S.ready)render()};
    const err=e=>{console.warn(e);toast("Archivio non raggiungibile: controlla la connessione")};
    const map=s=>s.docs.map(d=>({id:d.id,...d.data()}));
    this.db.collection("clienti").onSnapshot(s=>{S.clienti=map(s);done()},err);
    this.db.collection("preventivi").onSnapshot(s=>{S.preventivi=map(s);done()},err);
    this.db.doc("config/main").onSnapshot(s=>{S.config=s.exists?s.data():null;done()},err);
  },
  pushLocal(){S.clienti=Object.values(this.local.clienti);S.preventivi=Object.values(this.local.preventivi);S.config=this.local.config},
  async set(col,id,data){
    if(this.mode==="db")return this.db.collection(col).doc(id).set(data);
    this.local[col][id]={...data,id};lsSet(LKEY,this.local);this.pushLocal();render();
  },
  async del(col,id){
    if(this.mode==="db")return this.db.collection(col).doc(id).delete();
    delete this.local[col][id];lsSet(LKEY,this.local);this.pushLocal();render();
  },
  async setConfig(c){
    if(this.mode==="db")return this.db.doc("config/main").set(c);
    this.local.config=c;lsSet(LKEY,this.local);this.pushLocal();render();
  }
};

/* ---------- calcoli ---------- */
function tot(p){
  const r=(+p.iva||0)/100;
  if(p.modo==="totale"){const T=+p.importoCorpo||0;const base=p.ivaInclusa?T/(1+r):T;const iva=p.ivaInclusa?T-base:T*r;return {imp:base,sc:0,base,iva,totale:base+iva}}
  const imp=(p.voci||[]).reduce((s,v)=>s+(+v.qty||0)*(+v.prezzo||0),0);const sc=imp*(+p.sconto||0)/100;const base=imp-sc;const iva=base*r;return {imp,sc,base,iva,totale:base+iva}
}
function nextNumero(){const y=new Date().getFullYear();let m=0;S.preventivi.forEach(p=>{const r=String(p.numero||"").match(/^(\d{4})\/(\d+)/);if(r&&+r[1]===y)m=Math.max(m,+r[2])});const sg=String(cfg().sigla||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");return y+"/"+String(m+1).padStart(3,"0")+(sg?"-"+sg:"")}
const sortP=a=>a.slice().sort((x,y)=>(y.data||"").localeCompare(x.data||"")||(y.updatedAt||0)-(x.updatedAt||0));
const totOf=p=>p.totale??tot(p).totale;

/* ---------- viste ---------- */
const ICON_SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const ICON_X='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_UP='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>';
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===S.view?"page":"false"));
  const m=$("#main");
  if(!S.ready){m.innerHTML=heroHtml("<p style='margin:10px 0 0;opacity:.8'>Apro l'archivio…</p>");return}
  if(S.view==="preventivi")renderPreventivi(m);else if(S.view==="clienti")renderClienti(m);else renderListino(m);
}
function heroHtml(inner){return `<header class="hero"><div class="hero-in"><div class="eyebrow">Preventivi</div><h1>Argese<br>Decorazioni</h1>${inner}</div></header>`}
function renderPreventivi(m){
  const y=String(new Date().getFullYear());
  const att=S.preventivi.filter(p=>p.stato==="inviato"),acc=S.preventivi.filter(p=>p.stato==="accettato"&&(p.data||"").startsWith(y));
  const sumT=a=>a.reduce((s,p)=>s+totOf(p),0);
  const draft=lsGet(DKEY);
  const draftBanner=(draft&&draft.p&&!S.ed)?`<div class="banner"><div class="grow"><b>Preventivo non salvato</b><br>N. ${esc(draft.p.numero)} · ${esc(draft.p.cliente?.nome||"senza cliente")}</div><button class="btn sm primary" data-act="resume">Riprendi</button><button class="btn sm" data-act="discardDraft">Scarta</button></div>`:"";
  m.innerHTML=heroHtml(`<div class="rule"></div><div class="stats">
      <div><span>In attesa · ${att.length}</span><b class="num">${money(sumT(att))}</b></div>
      <div><span>Accettati ${y} · ${acc.length}</span><b class="num">${money(sumT(acc))}</b></div></div>`)+`
  <div class="wrap">
    <button class="btn primary big" data-act="new">+ Nuovo preventivo</button>
    ${draftBanner}
    ${S.preventivi.length>3?`<div class="search">${ICON_SEARCH}<input id="q" type="search" placeholder="Cerca cliente, via o numero" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="chips" role="group" aria-label="Filtra per stato">${[["tutti","Tutti"],...STATI].map(([k,l])=>`<button class="chip" data-act="filtro" data-v="${k}" aria-pressed="${S.filtro===k}">${l}</button>`).join("")}</div>`:""}
    <ul class="list" id="plist"></ul>
  </div>`;
  renderPList();
}
function prevItem(p){return `<li><button class="item" data-act="open" data-id="${esc(p.id)}">
  <span class="t">${esc(p.cliente?.nome||"Senza cliente")}</span><span class="amt num">${money(totOf(p))}</span>
  <span class="s">N. ${esc(p.numero)} · ${dIT(p.data)}${(p.cantiere||p.cliente?.indirizzo)?" · "+esc(p.cantiere||p.cliente?.indirizzo):""}</span><span class="pill ${esc(p.stato)}">${esc(p.stato)}</span></button></li>`}
function renderPList(){
  const el=$("#plist");if(!el)return;const q=S.q.trim().toLowerCase();

function openEditor(p,dirty=false){p.modo=p.modo||"voci";p.voci=p.voci||[];p.cliente=p.cliente||{nome:"",tel:"",indirizzo:""};S.ed=p;S.dirty=dirty;S.leaving=false;S.showCant=!!p.cantiere;renderEditor();$("#editor").hidden=false;$("#editor .sheet-body").scrollTop=0}

function updTotals(){const t=tot(S.ed),s=(id,v)=>{const e=$("#"+id);if(e)e.textContent=v};s("t-imp",money(S.ed.modo==="totale"?t.base:t.imp));s("t-sc",t.sc?"− "+money(t.sc):"—");s("t-iva",money(t.iva));s("t-tot",money(t.totale));s("f-tot",money(t.totale))}
function calcRes(box){const g=k=>num(box.querySelector(`[data-c="${k}"]`).value);const L=g("L"),P=g("P"),H=g("H")||2.7,D=g("D");const w=box.querySelector('[data-c="pareti"]').checked,s=box.querySelector('[data-c="soffitto"]').checked;let r=(w?2*(L+P)*H:0)+(s?L*P:0)-D;r=Math.max(0,Math.round(r*100)/100);box.querySelector("[data-cres]").textContent=fmtQty(r)+" mq";return r}
function onEdInput(e){
  const t=e.target,p=S.ed;if(!p)return;
  const box=t.closest(".calc");if(box&&t.dataset.c){calcRes(box);return}
  const f=t.dataset.f;if(!f)return;
  const vEl=t.closest("[data-vi]");
  if(vEl){const v=p.voci[+vEl.dataset.vi];if(f==="qty"||f==="prezzo")v[f]=num(t.value);else v[f]=t.value;
    const imp=vEl.querySelector("[data-imp]");if(imp)imp.textContent=money((+v.qty||0)*(+v.prezzo||0));
    if(f==="um"){const lab=vEl.querySelector("[data-plab]");if(lab)lab.textContent="€ / "+v.um}}
  else if(f.startsWith("cliente."))p.cliente[f.slice(8)]=t.value;
  else if(f==="sconto"||f==="importoCorpo")p[f]=num(t.value);
  else if(f==="iva"){p.iva=num(t.value);markDirty();renderEditor();return}
  else if(f==="validita")p[f]=parseInt(t.value)||0;
  else p[f]=t.value;
  markDirty();updTotals();
}
function prevDoc(p){const doc=clone(p);delete doc._new;delete doc.id;doc.totale=Math.round(tot(p).totale*100)/100;doc.updatedAt=Date.now();Object.keys(doc).forEach(k=>(doc[k]===undefined||doc[k]===null)&&delete doc[k]);return doc}
async function savePrev(){
  const p=S.ed;if(!p)return false;
  if(!p.cliente.nome.trim()){toast("Scrivi il nome del cliente");const n=$("#ed-nome");if(n){n.focus();n.scrollIntoView({block:"center"})}return false}
  try{
    const now=Date.now();const cl={nome:p.cliente.nome.trim(),tel:(p.cliente.tel||"").trim(),indirizzo:(p.cliente.indirizzo||"").trim()};
    let ex=p.clienteId?S.clienti.find(c=>c.id===p.clienteId):S.clienti.find(c=>(c.nome||"").trim().toLowerCase()===cl.nome.toLowerCase());
    if(!p.clienteId)p.clienteId=ex?ex.id:uid();
    const cd={...(ex||{}),...cl,createdAt:ex?.createdAt||now,updatedAt:now};delete cd.id;
    await Store.set("clienti",p.clienteId,cd);
    if(p._new&&S.preventivi.some(x=>x.numero===p.numero&&x.id!==p.id))p.numero=nextNumero();
    p.cliente=cl;p.createdAt=p.createdAt||now;
    await Store.set("preventivi",p.id,prevDoc(p));
    p._new=false;S.dirty=false;lsSet(DKEY,null);
    const h=$("#editor .ttl span");if(h)h.textContent="Preventivo";toast("Salvato");return true;
  }catch(err){console.error(err);toast("Non salvato: controlla la connessione e riprova");return false}
}

async function buildPdf(p,bgData){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});

  const t=tot(p),totMode=p.modo==="totale",drawn=new Set();

  const newPage=()=>{doc.addPage();bg();return TOP};

  // titolo
  doc.setTextColor(...NAVY);doc.setFont("times","bolditalic");doc.setFontSize(24);doc.text("Preventivo",M,y+3);
  doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(...INK);doc.text("N. "+p.numero,W-M,y-2,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...MUT);doc.text("Torino, "+dIT(p.data),W-M,y+2.6,{align:"right"});
  if(p.validita)doc.text("Valido fino al "+dIT(addDays(p.data,p.validita)),W-M,y+6.8,{align:"right"});
  y+=14;
  // cliente / luogo
  const bw=(W-2*M-8)/2;doc.setFontSize(10);
  const wrap=a=>a.filter(Boolean).flatMap(s=>doc.splitTextToSize(String(s),bw-2));
  const L1=wrap([p.cliente.nome,p.cliente.indirizzo,p.cliente.tel&&"Tel. "+p.cliente.tel]),L2=wrap([p.cantiere||p.cliente.indirizzo||"—"]);
  [[M,"SPETT.LE",L1],[M+bw+8,"LUOGO DEI LAVORI",L2]].forEach(([x,lab,ls])=>{doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...NAVY);doc.text(lab,x,y);doc.setDrawColor(...NAVY);doc.setLineWidth(.3);doc.line(x,y+1.6,x+bw,y+1.6);doc.setFontSize(10);doc.setTextColor(...INK);ls.forEach((l,i)=>{doc.setFont("helvetica",i===0&&lab==="SPETT.LE"?"bold":"normal");doc.text(l,x,y+6.8+i*4.8)})});
  y+=Math.max(L1.length,L2.length)*4.8+12;
  // tabella
  const hasQty=p.voci.some(v=>+v.qty);
  const head=totMode?(hasQty?[["Descrizione dei lavori","U.M.","Q.tà"]]:[["Descrizione dei lavori"]]):[["Descrizione dei lavori","U.M.","Q.tà","Prezzo","Importo"]];
  const body=[];
  p.voci.forEach(v=>{const d=(v.descr||"").trim();const end=!d;const cells=totMode?(hasQty?[v.nome,+v.qty?v.um:"",+v.qty?fmtQty(v.qty):""]:[v.nome]):[v.nome,v.um,fmtQty(v.qty),money(v.prezzo),money((+v.qty||0)*(+v.prezzo||0))];
    body.push(cells.map((c,j)=>({content:c,styles:{fontStyle:j===0?"bold":"normal",cellPadding:{top:3,bottom:d?1:3,left:2,right:2},lineWidth:end?{bottom:.15}:0,lineColor:LINE}})));
    if(d)body.push([{content:d,colSpan:head[0].length,styles:{fontSize:8.6,textColor:MUT,cellPadding:{top:0,bottom:3,left:2,right:2},lineWidth:{bottom:.15},lineColor:LINE}}])});
  if(!body.length)body.push([{content:"—",colSpan:head[0].length}]);
  const cs=totMode?{1:{cellWidth:20,halign:"center"},2:{cellWidth:18,halign:"right"}}:{1:{cellWidth:17,halign:"center"},2:{cellWidth:16,halign:"right"},3:{cellWidth:25,halign:"right"},4:{cellWidth:27,halign:"right"}};
  doc.autoTable({startY:y,margin:{left:M,right:M,top:TOP,bottom:297-BOT},head,body,theme:"plain",
    styles:{font:"helvetica",fontSize:9.5,textColor:INK,valign:"top",fillColor:false},
    headStyles:{fillColor:NAVY,textColor:255,fontStyle:"bold",fontSize:8.5,cellPadding:{top:2.4,bottom:2.4,left:2,right:2}},
    columnStyles:cs,
    didParseCell:d=>{if(d.section==="head"&&d.column.index>0)d.cell.styles.halign=d.column.index===1?"center":"right"},
    willDrawPage:()=>bg()});
  y=doc.lastAutoTable.finalY+7;

  else{rows.push(["Totale lavori",money(t.imp)]);if(t.sc){rows.push(["Sconto "+fmtQty(p.sconto)+"%","- "+money(t.sc)]);rows.push(["Imponibile",money(t.base)])}if(+p.iva)rows.push(["IVA "+fmtQty(p.iva)+"%",money(t.iva)])}
  if(y+rows.length*6+14>BOT)y=newPage()+4;
  const tx=W-M-80;doc.setFontSize(9.5);rows.forEach(([a,b])=>{doc.setFont("helvetica","normal");doc.setTextColor(...MUT);doc.text(a,tx,y);doc.setTextColor(...INK);doc.text(b,W-M,y,{align:"right"});y+=5.8});
  doc.setFillColor(...NAVY);doc.rect(tx-4,y-4.2,84,11,"F");doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(10);
  doc.text(totMode?"TOTALE LAVORI":"TOTALE",tx,y+2.8);doc.setFontSize(13);doc.text(money(t.totale),W-M-2,y+3,{align:"right"});
  y+=8.5;doc.setFont("helvetica","normal");doc.setFontSize(7.8);doc.setTextColor(...MUT);doc.text(+p.iva?"IVA "+fmtQty(p.iva)+"% inclusa":"IVA esclusa",W-M,y+2,{align:"right"});y+=10;
  // note e condizioni
  const para=(lab,txt)=>{if(!txt||!txt.trim())return;doc.setFontSize(9);const ls=doc.splitTextToSize(txt.trim(),W-2*M);if(y+ls.length*4.3+8>BOT)y=newPage()+4;doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(...NAVY);doc.text(lab,M,y);y+=4.6;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...INK);doc.text(ls,M,y);y+=ls.length*4.3+5};
  para("NOTE",p.note);para("CONDIZIONI",p.condizioni);
  const n=doc.getNumberOfPages();if(n>1)for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(...MUT);doc.text("Preventivo "+p.numero+" · pag. "+i+"/"+n,W-M,BOT+4,{align:"right"})}
  return {blob:doc.output("blob"),pages:n};
}
function waText(p){const C=cfg();const luogo=p.cantiere||p.cliente.indirizzo;return `Buongiorno ${p.cliente.nome.trim()}, le invio il preventivo n. ${p.numero}${luogo?" per i lavori in "+luogo:""}.\nTotale: ${money(tot(p).totale)}${+p.iva?" IVA inclusa":""}.\nResto a disposizione per qualsiasi chiarimento.\n${C.firma||C.azienda.nome}`}
function fileName(p){return "Preventivo_"+String(p.numero).replace(/\//g,"-")+"_"+(p.cliente.nome||"cliente").trim().split(/\s+/).pop().replace(/[^\wÀ-ſ-]/g,"")+".pdf"}
async function doPdf(){
  if(!window.jspdf||!window.jspdf.jsPDF||!window.jspdf.jsPDF.API.autoTable){toast("Il generatore PDF non si è caricato: controlla la connessione");return}
  if(!S.ed.voci.length&&S.ed.modo!=="totale"){toast("Aggiungi almeno un lavoro");return}
  if(S.ed.modo==="totale"&&!(+S.ed.importoCorpo)){toast("Scrivi il totale");$("#ed-corpo")?.focus();return}
  if(S.dirty||S.ed._new){if(!(await savePrev()))return}
  const p=S.ed;showModal(`<h3>Preparo il PDF…</h3><p class="muted" style="margin:0">N. ${esc(p.numero)} · ${esc(p.cliente.nome)}</p>`);
  try{let bgData=null;try{bgData=await loadBg()}catch(e){console.warn("carta intestata",e)}
    const {blob,pages}=await buildPdf(p,bgData);if(S.share&&S.share.url)URL.revokeObjectURL(S.share.url);S.share={blob,pages,p,file:null,url:Store.downloads?null:URL.createObjectURL(blob)};
    try{const f=new File([blob],fileName(p),{type:"application/pdf"});if(navigator.canShare&&navigator.canShare({files:[f]}))S.share.file=f}catch(e){}
    renderShare();
  }catch(e){console.error(e);showModal(`<h3>PDF non riuscito</h3><p class="muted">Qualcosa è andato storto nella creazione del file. Riprova.</p><button class="btn" data-act="mclose">Chiudi</button>`)}
}

  const {p,pages,file}=S.share;const tel=waNumber(p.cliente.tel);const txt=waText(p);const wa=`https://wa.me/${tel}?text=${encodeURIComponent(txt)}`;
  showModal(`<div class="row between"><h3>Preventivo pronto</h3><button class="icon-btn" data-act="mclose" aria-label="Chiudi">${ICON_X}</button></div>
  <p class="muted" style="margin:-6px 0 0">N. ${esc(p.numero)} · ${esc(p.cliente.nome)} · <b class="num">${money(tot(p).totale)}</b> · ${pages} ${pages===1?"pagina":"pagine"}</p>
  ${file?`<button class="btn wa big" data-act="shareFile">Invia il PDF (WhatsApp…)</button>`:`<div class="steps">
    <div class="step"><span class="n">1</span><div><b>Salva il PDF</b><p>Finisce nell'app File dell'iPhone.</p></div>
      <div class="act">${Store.downloads?`<button class="btn primary" data-act="pdfSave">Salva PDF</button>`:`<a class="btn primary" href="${S.share.url}" download="${esc(fileName(p))}">Salva PDF</a>`}</div></div>
    <div class="step"><span class="n">2</span><div><b>Apri WhatsApp</b><p>${tel?"Chat con "+esc(p.cliente.tel)+", messaggio già scritto.":"Scegli tu la chat, il messaggio è già scritto."} Poi allega il PDF con <b>+ → Documento</b>.</p></div>
      <div class="act"><a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">Apri WhatsApp</a><button class="btn" data-act="copyMsg">Copia testo</button></div></div>
  </div>`}
  <textarea id="waMsg" rows="5" readonly aria-label="Messaggio">${esc(txt)}</textarea>
  ${p.stato==="bozza"?`<button class="btn" data-act="markSent">Segna come inviato</button>`:""}`);
}
function showModal(html){const m=$("#modal");m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false}
function hideModal(){const m=$("#modal");m.hidden=true;m.innerHTML="";S.modalCtx=null}
function showCliente(c){
  const isNew=!c;c=c||{id:uid(),nome:"",tel:"",indirizzo:"",note:""};S.modalCtx={type:"cliente",c:clone(c),isNew};
  const ps=sortP(S.preventivi.filter(p=>p.clienteId===c.id));const tel=waNumber(c.tel);
  showModal(`<div class="row between"><h3>${isNew?"Nuovo cliente":esc(c.nome)}</h3><button class="icon-btn" data-act="mclose" aria-label="Chiudi">${ICON_X}</button></div>
  <label class="field"><span>Nome</span><input id="mc-nome" data-k="nome" value="${esc(c.nome)}"></label>
  <div class="grid2 stack"><label class="field"><span>Telefono</span><input id="mc-tel" data-k="tel" type="tel" value="${esc(c.tel)}"></label><label class="field"><span>Indirizzo</span><input id="mc-ind" data-k="indirizzo" value="${esc(c.indirizzo)}"></label></div>
  <label class="field"><span>Note</span><textarea id="mc-note" data-k="note" rows="2" placeholder="Citofono, orari, preferenze">${esc(c.note||"")}</textarea></label>
  <div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="saveCliente">Salva</button>${isNew?"":`<button class="btn" data-act="newForCliente">+ Preventivo</button>${tel?`<a class="btn wa" href="https://wa.me/${tel}" target="_blank" rel="noopener">WhatsApp</a>`:""}<button class="btn danger" data-act="delCliente">Elimina</button>`}</div>
  ${ps.length?`<div><span class="label">Preventivi</span><ul class="list" style="margin-top:6px">${ps.map(prevItem).join("")}</ul></div>`:""}`);
}
function armed(btn,label){if(btn.classList.contains("armed"))return true;btn.classList.add("armed");btn.dataset.orig=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent=btn.dataset.orig}},3500);return false}

/* ---------- eventi ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;const a=b.dataset.act,p=S.ed;
  switch(a){
    case "tab":S.view=b.dataset.v;if(S.view!=="listino")S.cfgDraft=null;render();$("#main").scrollTop=0;break;
    case "filtro":S.filtro=b.dataset.v;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===S.filtro));renderPList();break;
    case "new":openEditor(newPrev());break;
    case "resume":{const d=lsGet(DKEY);if(d&&d.p)openEditor(d.p,true);break}
    case "discardDraft":lsSet(DKEY,null);render();break;
    case "open":{const x=S.preventivi.find(q=>q.id===b.dataset.id);if(x){hideModal();const c=clone(x);c.id=x.id;openEditor(c)}break}
    case "closeEd":if(S.dirty){S.leaving=true;renderEditor();$("#editor .sheet-body").scrollTop=0}else closeEditor();break;
    case "forceClose":closeEditor();break;
    case "save":{const ok=await savePrev();if(ok&&b.dataset.then==="close")closeEditor();else if(ok&&S.leaving){S.leaving=false;renderEditor()}break}
    case "showCant":S.showCant=true;renderEditor();$("#ed-cant")?.focus();break;
    case "quickAdd":{const l=cfg().listino[+b.dataset.i];p.voci.push({id:uid(),nome:l.nome,descr:l.descr||"",um:l.um,qty:0,prezzo:+l.prezzo||0});markDirty();renderEditor();const q=$(`#editor [data-act="quickAdd"][data-i="${b.dataset.i}"]`);if(q){q.classList.add("flash");setTimeout(()=>q.classList.remove("flash"),700)}toast("Aggiunto: "+l.nome);break}
    case "freeAdd":{p.voci.push({id:uid(),nome:"",descr:"",um:"mq",qty:0,prezzo:0});markDirty();renderEditor();const v=p.voci[p.voci.length-1];const el=$("#v-n-"+v.id);if(el){el.placeholder="Che lavoro?";el.focus()}break}
    case "rmVoce":{const i=+b.closest("[data-vi]").dataset.vi;p.voci.splice(i,1);markDirty();renderEditor();break}
    case "upVoce":{const i=+b.closest("[data-vi]").dataset.vi;if(i>0){[p.voci[i-1],p.voci[i]]=[p.voci[i],p.voci[i-1]];markDirty();renderEditor()}break}
    case "umNext":{const vEl=b.closest("[data-vi]"),v=p.voci[+vEl.dataset.vi];v.um=UM[(UM.indexOf(v.um)+1)%UM.length];b.textContent=v.um;const lab=vEl.querySelector("[data-plab]");if(lab)lab.textContent="€ / "+v.um;markDirty();break}
    case "calcToggle":{const box=b.closest(".voce").querySelector(".calc");box.hidden=!box.hidden;if(!box.hidden)box.querySelector("input").focus();break}
    case "calcAdd":{const v=b.closest(".voce"),i=+v.dataset.vi,box=v.querySelector(".calc"),r=calcRes(box);if(!r){toast("Inserisci le misure");break}const vo=p.voci[i];vo.qty=Math.round(((+vo.qty||0)+r)*100)/100;vo.um="mq";markDirty();renderEditor();toast("+ "+fmtQty(r)+" mq");break}
    case "modo":if(p.modo!==b.dataset.v){p.modo=b.dataset.v;if(p.modo==="totale"&&!(+p.importoCorpo)){const tv=tot({...p,modo:"voci"});if(tv.base)p.importoCorpo=Math.round(tv.base*100)/100}markDirty();renderEditor()}break;
    case "ivaInc":p.ivaInclusa=b.dataset.v==="1";markDirty();renderEditor();break;
    case "pdf":doPdf();break;
    case "shareFile":{const s=S.share;navigator.share({files:[s.file],text:waText(s.p)}).catch(err=>{if(err&&err.name!=="AbortError")toast("Condivisione non riuscita")});break}
    case "pdfSave":{try{await Store.downloads.save({filename:fileName(S.share.p),data:S.share.blob});toast("PDF salvato")}catch(err){toast(err?.code==="declined"?"Salvataggio annullato":"Non sono riuscito a salvare il PDF")}break}
    case "copyMsg":{const t=$("#waMsg");try{await navigator.clipboard.writeText(t.value);toast("Testo copiato")}catch(err){t.focus();t.select();toast("Testo selezionato: copialo")}break}
    case "markSent":{p.stato="inviato";if(await savePrev()){b.remove();toast("Segnato come inviato")}break}
    case "mclose":hideModal();break;
    case "dupPrev":{const c=clone(p);c.id=uid();c.numero=nextNumero();c.data=todayISO();c.stato="bozza";c._new=true;delete c.createdAt;openEditor(c,true);toast("Copia creata");break}
    case "delPrev":{if(!armed(b,"Tocca di nuovo per eliminare"))break;try{await Store.del("preventivi",p.id);closeEditor();toast("Preventivo eliminato")}catch(err){toast("Eliminazione non riuscita")}break}
    case "newCliente":showCliente(null);break;
    case "openCliente":showCliente(S.clienti.find(c=>c.id===b.dataset.id));break;
    case "saveCliente":{const c=S.modalCtx.c;if(!c.nome.trim()){toast("Scrivi il nome");break}const now=Date.now();const d={...c,nome:c.nome.trim(),createdAt:c.createdAt||now,updatedAt:now};const id=d.id;delete d.id;try{await Store.set("clienti",id,d);hideModal();toast("Cliente salvato")}catch(err){toast("Salvataggio non riuscito")}break}
    case "newForCliente":{const c=S.clienti.find(x=>x.id===S.modalCtx.c.id);hideModal();openEditor(newPrev(c));break}
    case "delCliente":{const id=S.modalCtx.c.id;const n=S.preventivi.filter(p=>p.clienteId===id).length;if(n){toast("Ha "+n+" preventivi: elimina prima quelli");break}if(!armed(b,"Tocca di nuovo per eliminare"))break;await Store.del("clienti",id);hideModal();toast("Cliente eliminato");break}
    case "saveCfg":{const c=clone(S.cfgDraft);c.validita=parseInt(c.validita)||30;c.ivaDefault=+c.ivaDefault;try{await Store.setConfig(c);toast("Listino salvato")}catch(err){toast("Salvataggio non riuscito")}break}
    case "addLi":{S.cfgDraft.listino.push({id:uid(),nome:"",descr:"",um:"mq",prezzo:0});render();const l=S.cfgDraft.listino[S.cfgDraft.listino.length-1];const el=$("#li-n-"+l.id);if(el){el.placeholder="Nome del lavoro";el.focus()}break}
    case "exportBk":{const data={app:"argese-preventivi",v:1,at:new Date().toISOString(),clienti:S.clienti,preventivi:S.preventivi,config:S.config||cfg()};const name="Backup_Preventivi_"+todayISO()+".json";const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
      let shared=false;try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});shared=true}}catch(err){if(err&&err.name==="AbortError")break}
      if(!shared){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
      lsSet("argese_last_bk",Date.now());render();toast("Backup pronto");break}
    case "rmLi":{const i=+b.closest("[data-li]").dataset.li;S.cfgDraft.listino.splice(i,1);render();break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;renderPList();return}
  if(t.id==="qc"){S.qc=t.value;renderCList();return}
  if(t.closest("#editor")){if(t.tagName!=="SELECT")onEdInput(e);return}
  if(t.dataset.k&&S.modalCtx?.type==="cliente"){S.modalCtx.c[t.dataset.k]=t.value;return}
  if(t.dataset.cfg&&S.cfgDraft&&t.tagName!=="SELECT"){S.cfgDraft[t.dataset.cfg]=t.value;return}
  if(t.dataset.lf&&S.cfgDraft&&t.tagName!=="SELECT"){const i=+t.closest("[data-li]").dataset.li;S.cfgDraft.listino[i][t.dataset.lf]=t.dataset.lf==="prezzo"?num(t.value):t.value}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.actChange==="pickCliente"&&S.ed){const c=S.clienti.find(x=>x.id===t.value);if(c){S.ed.clienteId=c.id;S.ed.cliente={nome:c.nome||"",tel:c.tel||"",indirizzo:c.indirizzo||""};markDirty();renderEditor()}return}
  if(t.tagName==="SELECT"&&t.closest("#editor")){onEdInput(e);return}
  if(t.id==="bkIn"&&t.files[0]){const f=t.files[0];t.value="";importBk(f);return}
  if(t.tagName==="SELECT"&&S.cfgDraft){if(t.dataset.cfg)S.cfgDraft[t.dataset.cfg]=t.value;if(t.dataset.lf)S.cfgDraft.listino[+t.closest("[data-li]").dataset.li][t.dataset.lf]=t.value}
});
async function importBk(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("File non valido");return}
  if(!d||d.app!=="argese-preventivi"){toast("Non è un backup di Argese Preventivi");return}
  let nc=0,np=0;
  for(const c of d.clienti||[]){const ex=S.clienti.find(x=>x.id===c.id);if(!ex||(c.updatedAt||0)>(ex.updatedAt||0)){const x={...c};delete x.id;await Store.set("clienti",c.id,x);nc++}}
  for(const p of d.preventivi||[]){const ex=S.preventivi.find(x=>x.id===p.id);if(!ex||(p.updatedAt||0)>(ex.updatedAt||0)){const x={...p};delete x.id;await Store.set("preventivi",p.id,x);np++}}
  if(d.config){const mine=cfg();await Store.setConfig({...mine,...d.config,firma:mine.firma,sigla:mine.sigla});S.cfgDraft=null}
  render();toast("Importati: "+np+" preventivi, "+nc+" clienti e il listino");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)hideModal()});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")hideModal()});

if(IS_PWA){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
render();
Store.init().catch(err=>{console.error(err);Store.mode="local";S.ready=true;render()});
</script>
