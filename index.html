<!doctype html>
<html lang="it" data-pwa="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A3379">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Preventivi">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Argese Preventivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@1,600;1,700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a schermo intero — fascia blu della carta intestata in alto, contenuto che scorre, tab in basso; editor in tre passi sopra. */
:root{
  --navy:#2A3379; --navy-deep:#1C2260; --on-navy:#FFFFFF;
  --paper:#F4F5FA; --card:#FFFFFF; --ink:#171C3D; --muted:#5F6584; --line:#DDE0EC;
  --accent:#2F3A9E; --accent-soft:#E8EAF7;
  --ok:#1C7F54; --ok-soft:#E1F3EA; --warn:#9A6410; --warn-soft:#FBF0DC; --bad:#B53A33; --bad-soft:#FBE6E4; --wa:#1A8F4E;
  --f-display:"Crimson Pro","Times New Roman",Georgia,serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#232A68; --navy-deep:#151A45; --on-navy:#FFFFFF;
  --paper:#0E1124; --card:#171B33; --ink:#E8EAF6; --muted:#9BA1C0; --line:#2A3052;
  --accent:#9AA6FF; --accent-soft:#232A55;
  --ok:#4CC38A; --ok-soft:#14301F; --warn:#E3AE55; --warn-soft:#33270F; --bad:#F07C74; --bad-soft:#3A1A18; --wa:#3DCB7A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#232A68; --navy-deep:#151A45; --on-navy:#FFFFFF;
  --paper:#0E1124; --card:#171B33; --ink:#E8EAF6; --muted:#9BA1C0; --line:#2A3052;
  --accent:#9AA6FF; --accent-soft:#232A55;
  --ok:#4CC38A; --ok-soft:#14301F; --warn:#E3AE55; --warn-soft:#33270F; --bad:#F07C74; --bad-soft:#3A1A18; --wa:#3DCB7A;
  color-scheme:dark}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

#app{height:100%;display:grid;grid-template-rows:1fr auto}
main{overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}

/* fascia come la carta intestata */
.hero{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero-img{position:relative;max-width:680px;margin:0 auto;aspect-ratio:4/3;max-height:420px;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}
.hero-img::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(to bottom,transparent,var(--navy));pointer-events:none}
.hero-in{position:relative;z-index:1;max-width:680px;margin:-6px auto 0;padding:0 16px 20px}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.hero h1{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:34px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin-top:4px}
.hero .rule{height:1px;background:rgba(255,255,255,.35);margin:14px 0 12px}
.hero .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .stats span{display:block;font-size:12.5px;opacity:.8}
.hero .stats b{font-family:var(--f-display);font-style:italic;font-size:26px;font-weight:700;line-height:1.1}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.page-head h1{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:32px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line)}
.tabs button{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:14px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:4px;padding-right:4px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:14px}
.icon-btn{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn[disabled]{opacity:.3}

.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-family:var(--f-display);font-style:italic;font-size:22px;font-weight:700;text-align:right;line-height:1.1}
.pill{justify-self:end;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--muted)}
.pill.inviato{background:var(--warn-soft);color:var(--warn)}
.pill.accettato{background:var(--ok-soft);color:var(--ok)}
.pill.rifiutato{background:var(--bad-soft);color:var(--bad)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px}
.banner .grow{flex:1;min-width:170px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.contacts{display:flex;gap:6px;flex-wrap:wrap}
.contacts:empty{display:none}
.stato-seg button{font-size:14px;padding:8px 2px}
.stato-seg button[aria-pressed="true"][data-v="inviato"]{background:var(--warn-soft);color:var(--warn)}
.stato-seg button[aria-pressed="true"][data-v="accettato"]{background:var(--ok-soft);color:var(--ok)}
.stato-seg button[aria-pressed="true"][data-v="rifiutato"]{background:var(--bad-soft);color:var(--bad)}
.sub{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:-4px}
.quick button.tpl{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.toggle input{width:auto;accent-color:var(--navy);width:20px;height:20px}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:center;gap:10px}
.card-head .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.card-head h2{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:24px;flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2.stack{grid-template-columns:1fr}}

/* Editor */
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
.sheet-head{background:var(--navy);color:var(--on-navy);box-shadow:0 2px 10px rgba(10,14,40,.18);position:relative;z-index:2}
.hrow{display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
.secnav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{flex:none;border:0;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;background:rgba(255,255,255,.12);color:var(--on-navy);cursor:pointer;transition:background .2s,color .2s}
.secnav button[aria-current="true"]{background:#fff;color:#2A3379}
.secnav i{font-style:normal;opacity:.85;margin-left:2px}
section[id]{scroll-margin-top:12px}
.sheet-head .icon-btn{color:var(--on-navy)}
.sheet-head .ttl{flex:1;min-width:0}
.sheet-head .ttl span{font-size:12px;opacity:.75;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.sheet-head .ttl b{font-family:var(--f-display);font-style:italic;font-size:23px;display:block;line-height:1.05}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.sheet-foot .tot{flex:1;min-width:0}
.sheet-foot .tot b{font-family:var(--f-display);font-style:italic;font-size:28px;line-height:1;display:block}
.unsaved{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;font-size:14px}

.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
.quick button:hover{border-color:var(--accent)}
.quick button.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.quick button.other{border-style:dashed;color:var(--accent)}

.voce{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.vtop{display:flex;gap:2px;align-items:center}
.vtop input{font-weight:700;background:transparent;border-color:transparent;padding:6px 8px;font-size:17px}
.vtop input:hover{border-color:var(--line)}
.voce textarea{font-size:14px;padding:8px 10px;color:var(--muted)}
.vnums{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.vnums.noprice{grid-template-columns:1fr auto}
.vnums .field>span{font-size:12px}
.qty{display:flex}
.qty input{border-radius:12px 0 0 12px;text-align:right}
.qty input{padding-left:6px;padding-right:8px}.qty .um{flex:none;min-width:70px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;padding:0 10px;cursor:pointer;white-space:nowrap}
.vnums input[data-f="prezzo"]{text-align:right}
.imp{text-align:right;padding-bottom:10px}
.imp span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.imp b{font-size:17px;white-space:nowrap}
.calc{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.calc .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .g4 input{padding:9px 8px;text-align:right}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:auto;accent-color:var(--navy)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,24,60,.15)}
.bigin{position:relative}
.bigin input{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:30px;padding:10px 14px 10px 40px;text-align:right}
.bigin i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:22px;color:var(--muted)}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:15px}
.sum .r{text-align:right}
.sum .big{font-family:var(--f-display);font-style:italic;font-size:30px;font-weight:700}
.sum hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.inline{display:flex;gap:6px;align-items:center}
.inline input{width:76px;padding:7px 8px;text-align:right}
details.more{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.more summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:20px;line-height:1;color:var(--accent)}
details.more[open] summary::after{content:"–"}
details.more .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}

.modal{position:fixed;inset:0;z-index:40;background:rgba(10,12,35,.55);display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.mbox h3{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:26px}
@media (min-width:600px){.modal{align-items:center}.mbox{border-radius:20px}}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-weight:700}
.step p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.step .act{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.listino-row{display:grid;grid-template-columns:1fr 86px 86px 40px;gap:6px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.listino-row input,.listino-row select{padding:9px}
.listino-row .pz{text-align:right}
.listino-desc{grid-column:1/-1;font-size:14px}
.home-tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.home-tip svg{width:30px;height:30px;color:var(--accent)}
.home-tip ol{margin:6px 0 0;padding-left:18px;font-size:15px}

.toast.in{animation:tin .22s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.mbox{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}.quick button{transition:background .2s,border-color .2s}}

/* --- rifinitura e fluidità --- */
.btn,.item,.quick button,.chip,.seg button,.secnav button,.tabs button,.icon-btn{transition:transform .12s ease,background .2s,border-color .2s,color .2s}
.btn:active,.item:active,.quick button:active,.chip:active,.seg button:active,.secnav button:active,.icon-btn:active{transform:scale(.96)}
.tabs .ic{display:grid;place-items:center;width:58px;height:30px;border-radius:999px;transition:background .25s}
.tabs button[aria-current="page"] .ic{background:var(--accent-soft)}
.card{box-shadow:0 1px 2px rgba(20,24,60,.05),0 4px 14px rgba(20,24,60,.04)}
.item.pv{grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em;position:relative;flex:none}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:var(--line)}
.av.st-inviato::after{background:var(--warn)}.av.st-accettato::after{background:var(--ok)}.av.st-rifiutato::after{background:var(--bad)}.av.st-cliente::after{display:none}
.mid{display:flex;flex-direction:column;gap:2px;min-width:0}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.list .month{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 0;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.list .month:first-child{padding-top:0}
.hero .stat{background:none;border:0;padding:6px 8px;margin:-6px -8px;border-radius:10px;color:inherit;text-align:left;cursor:pointer}
.hero .stat:active{background:rgba(255,255,255,.1)}
.hero .stat small{display:block;font-size:11.5px;opacity:.65;margin-top:2px}
.dprev{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:14px;color:var(--muted);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-foot .btn.primary{padding:13px 24px;font-size:17px;border-radius:14px}
.sheet-foot .tot small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#ed-status.ok::before{content:"✓ ";}
@media (prefers-reduced-motion:no-preference){
  .sheet.in{animation:sheetIn .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes sheetIn{from{transform:translateY(28px);opacity:0}}
  .voce.new{animation:vin .3s ease-out}
  @keyframes vin{from{opacity:0;transform:translateY(-6px)}}
}
@media (prefers-reduced-motion:reduce){.btn:active,.item:active,.quick button:active,.chip:active,.seg button:active{transform:none}}

.toast{display:flex;align-items:center;gap:14px}
.tbtn{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 0;font-size:14px}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.opzbtn{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.opzbtn[aria-pressed="true"]{border-style:solid;border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.voce.opz{border-style:dashed;opacity:.92}

<script>

const $=(s,r=document)=>r.querySelector(s);

const uid=()=>{try{return crypto.randomUUID().replace(/-/g,"").slice(0,20)}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}};
const clone=o=>JSON.parse(JSON.stringify(o));
function fmtNum(n,d=2){n=+n||0;const neg=n<0;let [i,f]=Math.abs(Math.round(n*100)/100).toFixed(d).split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g,".");return (neg?"-":"")+i+(d?","+f:"")}
const money=n=>"€ "+fmtNum(n);
function fmtQty(n){n=+n||0;const r=Math.round(n*100)/100;return Number.isInteger(r)?fmtNum(r,0):fmtNum(r,2).replace(/,?0$/,"")}
function num(v){v=String(v??"").trim().replace(/\s|€/g,"");if(!v)return 0;if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");const n=parseFloat(v);return isFinite(n)?n:0}
const inVal=n=>(n===0||n==null||n==="")?"":String(Math.round(n*100)/100).replace(".",",");
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayISO=()=>isoOf(new Date());
function dIT(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+(+n||0));return isoOf(d)}
function waNumber(t){let d=String(t||"").replace(/\D/g,"");if(!d)return "";if(d.startsWith("00"))d=d.slice(2);if(d.length<=10&&/^3/.test(d))d="39"+d;return d}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let toastT,toastFn=null;function toast(m,act){const t=$("#toast");t.innerHTML="";const sp=document.createElement("span");sp.textContent=m;t.appendChild(sp);toastFn=null;
  if(act){const bt=document.createElement("button");bt.className="tbtn";bt.textContent=act.label;toastFn=act.fn;t.appendChild(bt)}
  t.hidden=false;t.classList.remove("in");void t.offsetWidth;t.classList.add("in");clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;toastFn=null},act?5000:2600)}

const STATI=[["bozza","Bozza"],["inviato","Inviato"],["accettato","Accettato"],["rifiutato","Rifiutato"]];

  azienda:{nome:"Argese Decorazioni"},firma:"Argese Decorazioni",sigla:"",ivaDefault:22,validita:30,acconto:30,
  noteRapide:["Colori a scelta del cliente","Spostamento mobili a cura del cliente","Ponteggi esclusi","Lavori eseguibili con casa abitata","Smaltimento materiali compreso"],
  modelli:[{id:"m1",nome:"Tinteggiatura completa",lids:["cop","fis","pit","pul"]},{id:"m2",nome:"Rasatura e pittura",lids:["cop","stu","rsg","fis","pit","pul"]}],
  condizioni:"Prezzi comprensivi di materiali, manodopera e protezioni. Pagamento: 30% all'accettazione, saldo a fine lavori. Lavori extra non indicati saranno concordati a parte. Le quantità sono stimate da sopralluogo e verranno verificate a misura a fine lavori.",
  listino:[
    {id:"cop",nome:"Protezioni e coperture",descr:"Copertura di pavimenti, mobili e infissi con teli e nastro",um:"mq",prezzo:1.5},
    {id:"ras",nome:"Raschiatura e pulizia",descr:"Rimozione di parti incoerenti e vecchia pittura",um:"mq",prezzo:3},
    {id:"stu",nome:"Stuccatura crepe e fori",descr:"Apertura e stuccatura di crepe, fori e imperfezioni",um:"ml",prezzo:6},
    {id:"rsg",nome:"Rasatura",descr:"Rasatura a stucco in due mani e carteggiatura finale",um:"mq",prezzo:10},
    {id:"fis",nome:"Fissativo",descr:"Applicazione di fissativo isolante acrilico",um:"mq",prezzo:2},

    {id:"dec",nome:"Effetto decorativo",descr:"Finitura decorativa o materica a scelta del cliente",um:"mq",prezzo:30},
    {id:"est",nome:"Tinteggiatura esterni",descr:"Pittura silossanica per esterni, due mani",um:"mq",prezzo:16},
    {id:"pul",nome:"Pulizia finale e smaltimento",descr:"Pulizia del cantiere e smaltimento dei materiali",um:"a corpo",prezzo:120}

/* ---------- stato ---------- */
const S={view:"preventivi",q:"",qc:"",filtro:"tutti",clienti:[],preventivi:[],config:null,ready:false,ed:null,dirty:false,cfgDraft:null,share:null};
const cfg=()=>{const c=S.config||{};return {...clone(DEFAULT_CONFIG),...c,azienda:{...DEFAULT_CONFIG.azienda,...(c.azienda||{})},listino:c.listino||clone(DEFAULT_CONFIG.listino),modelli:c.modelli||clone(DEFAULT_CONFIG.modelli),noteRapide:c.noteRapide||clone(DEFAULT_CONFIG.noteRapide),acconto:c.acconto??DEFAULT_CONFIG.acconto}};

/* ---------- archivio: online (db) o su questo dispositivo ---------- */
const APP_VERSION="10 ott 2026 · 05:00";
const IS_PWA=document.documentElement.dataset.pwa==="1";
const IS_STANDALONE=(()=>{try{return window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches}catch(e){return false}})();
const LKEY="argese_prev_local_v1",DKEY="argese_prev_draft_v1";
const Store={mode:"local",db:null,downloads:null,local:{clienti:{},preventivi:{},config:null},
  async init(){
    if(!IS_PWA)for(let i=0;i<15&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
    const c=IS_PWA?null:window.claude;
    if(c&&typeof c.use==="function"){
      const safe=p=>Promise.resolve(p).catch(()=>null);
      const [db,downloads]=await Promise.all([safe(c.use("db")),safe(c.use("downloads"))]);
      this.downloads=downloads;
      if(db){this.db=db;this.mode="db";this.listen();return}
    }
    const l=lsGet(LKEY);if(l)this.local=l;
    this.pushLocal();S.ready=true;render();
  },
  listen(){
    let n=0;const done=()=>{if(++n>=3)S.ready=true;if(S.ready)render()};
    const err=e=>{console.warn(e);toast("Archivio non raggiungibile: controlla la connessione")};
    const map=s=>s.docs.map(d=>({id:d.id,...d.data()}));
    this.db.collection("clienti").onSnapshot(s=>{S.clienti=map(s);done()},err);
    this.db.collection("preventivi").onSnapshot(s=>{S.preventivi=map(s);done()},err);
    this.db.doc("config/main").onSnapshot(s=>{S.config=s.exists?s.data():null;done()},err);
  },
  pushLocal(){S.clienti=Object.values(this.local.clienti);S.preventivi=Object.values(this.local.preventivi);S.config=this.local.config},
  async set(col,id,data){
    if(this.mode==="db")return this.db.collection(col).doc(id).set(data);
    this.local[col][id]={...data,id};lsSet(LKEY,this.local);this.pushLocal();render();
  },
  async del(col,id){
    if(this.mode==="db")return this.db.collection(col).doc(id).delete();
    delete this.local[col][id];lsSet(LKEY,this.local);this.pushLocal();render();
  },
  async setConfig(c){
    if(this.mode==="db")return this.db.doc("config/main").set(c);
    this.local.config=c;lsSet(LKEY,this.local);this.pushLocal();render();
  }
};

/* ---------- calcoli ---------- */
const qEff=(v,p)=>(+v.qty>0)?+v.qty:((v.um==="mq"&&+p.mqTot>0)?+p.mqTot:0);
function tot(p){
  const r=(+p.iva||0)/100;
  if(p.modo==="totale"){const T=+p.importoCorpo||0;const base=p.ivaInclusa?T/(1+r):T;const iva=p.ivaInclusa?T-base:T*r;return {imp:base,sc:0,ar:0,base,iva,totale:base+iva}}
  const imp=(p.voci||[]).filter(v=>!v.opz).reduce((s,v)=>s+qEff(v,p)*(+v.prezzo||0),0);const sc=p.scontoTipo==="€"?Math.min(+p.sconto||0,imp):imp*(+p.sconto||0)/100;let base=imp-sc,ar=0;
  if(p.tondo&&base>0){const pre=base*(1+r),step=pre>=1000?50:10,tg=Math.floor(pre/step+1e-9)*step;if(tg>0&&tg<pre-0.004){ar=base-tg/(1+r);base=tg/(1+r)}}
  const iva=base*r;return {imp,sc,ar,base,iva,totale:base+iva}
}

async function saveFile(name,blob){
  if(Store.downloads){try{await Store.downloads.save({filename:name,data:blob});return true}catch(e){if(e&&e.code==="declined")return false}}
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);return true}

function renderPreventivi(m){
  const y=String(new Date().getFullYear());
  const att=S.preventivi.filter(p=>p.stato==="inviato"),acc=S.preventivi.filter(p=>p.stato==="accettato"&&(p.data||"").startsWith(y));
  const sumT=a=>a.reduce((s,p)=>s+totOf(p),0);
  const draft=lsGet(DKEY);
  const draftBanner=(draft&&draft.p&&!S.ed)?`<div class="banner"><div class="grow"><b>Preventivo non salvato</b><br>N. ${esc(draft.p.numero)} · ${esc(draft.p.cliente?.nome||"senza cliente")}</div><button class="btn sm primary" data-act="resume">Riprendi</button><button class="btn sm" data-act="discardDraft">Scarta</button></div>`:"";
  const mk=todayISO().slice(0,7),mese=S.preventivi.filter(p=>(p.data||"").startsWith(mk)),anno=S.preventivi.filter(p=>(p.data||"").startsWith(y));const ris=[];
  const risBanner=ris.length?`<div class="banner warn"><div class="grow"><b>${ris.length} ${ris.length===1?"preventivo da risentire":"preventivi da risentire"}</b><br>Inviati da più di una settimana senza risposta.</div><button class="btn sm primary" data-act="filtro" data-v="risentire">Vedi</button></div>`:"";
  const lastBk=lsGet("argese_last_bk");
  const bkBanner=(Store.mode==="local"&&S.preventivi.length&&(!lastBk||Date.now()-lastBk>14*DAY))?`<div class="banner"><div class="grow"><b>Fai una copia di sicurezza</b><br>${lastBk?"Ultimo backup "+Math.floor((Date.now()-lastBk)/DAY)+" giorni fa.":"Non hai ancora fatto nessun backup."}</div><button class="btn sm primary" data-act="exportBk">Fai backup</button></div>`:"";
  m.innerHTML=heroHtml(`<div class="rule"></div><div class="stats">
      <div><span>Questo mese · ${mese.length}</span><b class="num">${money(sumT(mese))}</b></div>
      <div><span>Anno ${y} · ${anno.length}</span><b class="num">${money(sumT(anno))}</b></div></div>`)+`
  <div class="wrap">
    <button class="btn primary big" data-act="new">+ Nuovo preventivo</button>
    ${draftBanner}${bkBanner}
    ${S.preventivi.length>3?`<div class="search">${ICON_SEARCH}<input id="q" type="search" placeholder="Cerca cliente, via o numero" value="${esc(S.q)}" autocomplete="off"></div>
`:""}
    <ul class="list" id="plist"></ul>
  </div>`;
  renderPList();
}
const MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
function initials(n){const w=String(n||"").replace(/\(.*?\)/g,"").trim().split(/\s+/).filter(Boolean);return ((w[0]||"?")[0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase()}
function prevItem(p){const pill=isAz(p.cliente)?`<span class="pill">azienda</span>`:"";
  return `<li><button class="item pv" data-act="open" data-id="${esc(p.id)}"><span class="av st-cliente" aria-hidden="true">${esc(initials(p.cliente?.nome))}</span>
  <span class="mid"><span class="t">${esc(p.cliente?.nome||"Senza cliente")}</span><span class="s">N. ${esc(p.numero)} · ${dIT(p.data)}${(p.cantiere||p.cliente?.indirizzo)?" · "+esc(p.cantiere||p.cliente?.indirizzo):""}</span></span>
  <span class="rt"><span class="amt num">${money(totOf(p))}</span>${pill}</span></button></li>`}
function renderPList(){
  const el=$("#plist");if(!el)return;const q=S.q.trim().toLowerCase();
  const rows=sortP(S.preventivi).filter(p=>(!q||[p.numero,p.cliente?.nome,p.cliente?.indirizzo,p.cliente?.piva,p.cantiere].join(" ").toLowerCase().includes(q)));
  let last="",out="";for(const p of rows){const k=(p.data||"").slice(0,7);if(k!==last){last=k;const inM=rows.filter(x=>(x.data||"").slice(0,7)===k);const [yy,mm]=k.split("-");out+=`<li class="month"><span>${mm?MESI[+mm-1]+" "+yy:"Senza data"}</span><span class="num">${inM.length} · ${money(inM.reduce((a,x)=>a+totOf(x),0))}</span></li>`}out+=prevItem(p)}
  el.innerHTML=rows.length?out:`<li class="empty">${S.preventivi.length?"Nessun preventivo corrisponde alla ricerca.":"Ancora nessun preventivo. Tocca <b>+ Nuovo preventivo</b>."}</li>`;
}
function renderClienti(m){
  m.innerHTML=`<div class="wrap"><div class="page-head"><h1>Clienti</h1><button class="btn sm primary" data-act="newCliente">+ Cliente</button></div>
    <div class="search">${ICON_SEARCH}<input id="qc" type="search" placeholder="Cerca per nome, telefono o via" value="${esc(S.qc)}" autocomplete="off"></div>
    <ul class="list" id="clist"></ul></div>`;
  renderCList();
}
function renderCList(){
  const el=$("#clist");if(!el)return;const q=S.qc.trim().toLowerCase();
  const rows=S.clienti.slice().sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","it")).filter(c=>!q||[c.nome,c.tel,c.indirizzo].join(" ").toLowerCase().includes(q));
  if(!rows.length){el.innerHTML=`<li class="empty">${S.clienti.length?"Nessun cliente trovato.":"I clienti si aggiungono da soli quando salvi un preventivo."}</li>`;return}
  el.innerHTML=rows.map(c=>{const n=S.preventivi.filter(p=>p.clienteId===c.id).length;
    return `<li><button class="item pv" data-act="openCliente" data-id="${esc(c.id)}"><span class="av st-cliente" aria-hidden="true">${esc(initials(c.nome))}</span><span class="mid"><span class="t">${esc(c.nome)}</span><span class="s">${esc([isAz(c)?"Azienda"+(c.piva?" · P.IVA "+c.piva:""):"",c.indirizzo,c.tel].filter(Boolean).join(" · ")||"—")}</span></span><span class="rt"><span class="muted" style="font-size:14px">${n} ${n===1?"preventivo":"preventivi"}</span></span></button></li>`}).join("");
}

      <label class="field"><span>Acconto proposto con "+ Aggiungi acconto" (%)</span><input id="cfg-acc" data-cfg="acconto" inputmode="decimal" value="${esc(c.acconto)}"></label>

      <p class="muted" style="margin:0;font-size:14px">Clienti, preventivi e listino sono salvati su questo telefono. Fai un backup ogni tanto e mandalo a te stesso su WhatsApp o salvalo in File. Con <b>Importa</b> puoi anche passare il listino a un altro telefono.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn" data-act="exportBk">Esporta backup</button><label class="btn" style="position:relative">Importa backup<input id="bkIn" type="file" accept=".json,application/json" style="position:absolute;inset:0;opacity:0"></label></div>
      <span class="muted num" style="font-size:13px">${S.preventivi.length} preventivi · ${S.clienti.length} clienti${lsGet("argese_last_bk")?" · ultimo backup "+new Date(lsGet("argese_last_bk")).toLocaleDateString("it-IT"):" · nessun backup ancora"}</span></div>`:""}

      <div><b>Mettila nella schermata Home</b>${IS_PWA?`<ol><li><b>iPhone:</b> in Safari tocca <b>Condividi</b> → <b>Aggiungi alla schermata Home</b>.</li><li><b>Android:</b> in Chrome tocca <b>⋮</b> → <b>Aggiungi a schermata Home</b>.</li></ol>`:`<ol><li>Apri questa pagina in <b>Safari</b> (con l'accesso a claude.ai fatto).</li><li>Tocca <b>Condividi</b> in basso.</li><li>Scegli <b>Aggiungi alla schermata Home</b> e chiamala “Preventivi”.</li></ol>`}</div></div>`}
  </div>`;
}

/* ---------- editor ---------- */
function newPrev(cliente){const c=cfg();return {id:uid(),numero:nextNumero(),data:todayISO(),clienteId:cliente?.id||null,cliente:clienteSnap(cliente||{}),cantiere:"",modo:"voci",voci:[],importoCorpo:0,ivaInclusa:false,sconto:0,iva:c.ivaDefault,validita:c.validita,note:"",condizioni:c.condizioni,stato:"bozza",acconto:0,scontoTipo:"%",inizio:"",costi:0,noteInt:"",tempi:"",descrLavori:"",mqTot:0,tondo:false,_new:true}}
function openEditor(p,dirty=false){p.modo=p.modo||"voci";p.voci=p.voci||[];p.cliente={...clienteSnap({}),...(p.cliente||{})};S.ed=p;S.dirty=dirty;S.leaving=false;S.showCant=!!p.cantiere;S.openD=new Set();S.tplForm=false;S.edFresh=!!p._new;S.pickedId=p._new&&p.clienteId?p.clienteId:null;S.editVer=0;
  renderEditor();const ed=$("#editor");ed.hidden=false;ed.classList.remove("in");void ed.offsetWidth;ed.classList.add("in");ed.querySelector(".sheet-body").scrollTop=0;if(dirty)scheduleSave()}
function closeEditor(){clearTimeout(saveT);if(S.io)S.io.disconnect();S.ed=null;S.dirty=false;lsSet(DKEY,null);$("#editor").hidden=true;$("#editor").innerHTML="";render()}
async function tryClose(){const p=S.ed;if(!p)return;clearTimeout(saveT);
  if(S.dirty){if(p.cliente.nome.trim()){if(!(await savePrev(true))){S.leaving=true;renderEditor();return}}
    else if(p.voci.length||+p.importoCorpo){S.leaving=true;renderEditor();$("#editor .sheet-body").scrollTop=0;return}}
  if(S.edFresh&&!p._new&&!p.voci.length&&!(+p.importoCorpo)){try{await Store.del("preventivi",p.id)}catch(e){}}
  closeEditor()}
let saveT,draftT;
function setStatus(t,ok){const h=$("#ed-status");if(h){h.textContent=t;h.classList.toggle("ok",!!ok)}}
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(autoSave,1200)}
async function autoSave(){const p=S.ed;if(!p||!S.dirty)return;const ae=document.activeElement;if(ae&&ae.id==="ed-nome")return;if(!p.cliente.nome.trim()){setStatus("Scrivi il nome del cliente per salvare");return}await savePrev(true)}
function markDirty(){S.dirty=true;S.editVer=(S.editVer||0)+1;setStatus("Modifiche in corso…");clearTimeout(draftT);draftT=setTimeout(()=>lsSet(DKEY,{p:S.ed,ts:Date.now()}),500);scheduleSave()}
function updNav(){const p=S.ed;if(!p)return;const b=$('#editor .secnav [data-v="sec-cli"] i');if(b)b.textContent=p.cliente.nome.trim()?"✓":""}

function voceHtml(v,i,p){
  const priced=p.modo!=="totale"||v.opz;
  return `<div class="voce${v._fresh?" new":""}${v.opz?" opz":""}" data-vi="${i}">
    <div class="vtop"><input id="v-n-${esc(v.id)}" data-f="nome" value="${esc(v.nome)}" aria-label="Lavoro"><button class="icon-btn" data-act="upVoce" aria-label="Sposta su" ${i?"":"disabled"}>${ICON_UP}</button><button class="icon-btn" data-act="dupVoce" aria-label="Duplica lavoro"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button><button class="icon-btn" data-act="rmVoce" aria-label="Togli lavoro">${ICON_X}</button></div>
    ${S.openD&&S.openD.has(v.id)?`<textarea id="v-d-${esc(v.id)}" data-f="descr" rows="2" placeholder="Dettagli: ambiente, mani, colore…">${esc(v.descr)}</textarea>`:`<button class="dprev" data-act="openD">${v.descr?esc(v.descr):"+ Aggiungi dettagli (ambiente, mani, colore…)"}</button>`}
    <div class="vnums ${priced?"":"noprice"}">
      <label class="field"><span>Quantità${priced?"":" (facoltativa)"}</span><div class="qty"><input id="v-q-${esc(v.id)}" class="num" data-f="qty" inputmode="decimal" value="${inVal(v.qty)}" placeholder="${v.um==="mq"&&+p.mqTot?fmtQty(p.mqTot):"0"}"><button type="button" class="um" data-act="umNext" aria-label="Unità: tocca per cambiare">${esc(v.um)}</button></div></label>
      ${priced?`<label class="field"><span data-plab>€ / ${esc(v.um)}</span><input id="v-p-${esc(v.id)}" class="num" data-f="prezzo" inputmode="decimal" value="${inVal(v.prezzo)}" placeholder="0"></label>
      <div class="imp"><span>Importo</span><b class="num" data-imp>${money(qEff(v,p)*(+v.prezzo||0))}</b></div>`:""}
    </div>
    <div class="vfoot"><button class="opzbtn" data-act="opz" aria-pressed="${!!v.opz}">${v.opz?"✓ Facoltativo · fuori dal totale":"Facoltativo?"}</button><span class="vlist">${priced?listinoBtn(v):""}</span></div>
  </div>`;
}
function renderEditor(){
  const p=S.ed,ed=$("#editor"),body=ed.querySelector(".sheet-body"),st=body?body.scrollTop:0;
  const t=tot(p),L=cfg().listino,tot_=p.modo==="totale";
  const clientOpts=S.clienti.slice().sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","it")).map(c=>`<option value="${esc(c.id)}" ${p.clienteId===c.id?"selected":""}>${esc(c.nome)}</option>`).join("");
  const ivaSel=`<select id="ed-iva" data-f="iva" aria-label="IVA" style="width:auto;padding:7px 8px">${[22,10,4,0].map(v=>`<option value="${v}" ${+p.iva===v?"selected":""}>${v?"IVA "+v+"%":"Senza IVA"}</option>`).join("")}</select>`;
  ed.innerHTML=`
  <div class="sheet-head">
    <div class="hrow"><button class="icon-btn" data-act="closeEd" aria-label="Chiudi e torna alla lista">${ICON_X}</button>
    <div class="ttl"><span id="ed-status" class="${!S.dirty&&!p._new?"ok":""}">${S.dirty?"Modifiche in corso…":p._new?"Nuovo preventivo":"Salvato"}</span><b class="num">N. ${esc(p.numero)}</b></div></div>
    <nav class="secnav" aria-label="Sezioni del preventivo">${[["sec-cli","Cliente",p.cliente.nome.trim()?"✓":""],["sec-lav","Lavori",p.voci.length||""],["sec-pr","Prezzo",""],["sec-note","Note",""]].map(([id,l,bd],k)=>`<button data-act="goSec" data-v="${id}" aria-current="${k===0}">${l} <i>${bd}</i></button>`).join("")}</nav>
  </div>
  <div class="sheet-body"><div class="wrap">
    ${S.leaving?`<div class="unsaved"><span style="flex:1;min-width:150px">Manca il nome del cliente: senza nome non posso salvarlo.</span><button class="btn sm primary" data-act="focusName">Scrivi il nome</button><button class="btn sm" data-act="forceClose">Esci senza salvare</button></div>`:""}
    <section class="card" id="sec-cli">
      <div class="card-head"><span class="n">1</span><h2>Cliente</h2></div>
      <div class="seg" role="group" aria-label="Tipo di cliente"><button data-act="clTipo" data-v="privato" aria-pressed="${!isAz(p.cliente)}">Privato</button><button data-act="clTipo" data-v="azienda" aria-pressed="${isAz(p.cliente)}">Azienda</button></div>
      <label class="field"><span>${isAz(p.cliente)?"Ragione sociale":"Nome"}${S.clienti.length?" (i clienti salvati compaiono da soli)":""}</span><input id="ed-nome" data-f="cliente.nome" value="${esc(p.cliente.nome)}" autocomplete="off" list="clientiDL" placeholder="${isAz(p.cliente)?"Es. Rossi Costruzioni S.r.l.":"Es. Famiglia Bianchi"}"></label>
      ${isAz(p.cliente)?`<div class="grid2 stack"><label class="field"><span>Partita IVA</span><input id="ed-piva" data-f="cliente.piva" inputmode="numeric" value="${esc(p.cliente.piva)}" placeholder="11 cifre"></label>
      <label class="field"><span>Codice SDI o PEC</span><input id="ed-sdi" data-f="cliente.sdi" autocapitalize="off" value="${esc(p.cliente.sdi)}" placeholder="Es. M5UXCR1"></label></div>
      <label class="field"><span>Referente</span><input id="ed-ref" data-f="cliente.referente" value="${esc(p.cliente.referente)}" placeholder="Es. Geom. Bianchi"></label>`:""}
      <datalist id="clientiDL">${S.clienti.map(c=>`<option value="${esc(c.nome)}"></option>`).join("")}</datalist>
      <div class="grid2 stack"><label class="field"><span>Telefono</span><input id="ed-tel" data-f="cliente.tel" type="tel" value="${esc(p.cliente.tel)}" placeholder="333 123 4567"></label>
      <label class="field"><span>Indirizzo</span><input id="ed-ind" data-f="cliente.indirizzo" value="${esc(p.cliente.indirizzo)}" placeholder="Via, numero, città"></label></div>
      <div class="contacts" id="contacts">${contactBtns(p.cliente.tel,p.cantiere||p.cliente.indirizzo)}</div>
      ${S.showCant?`<label class="field"><span>Indirizzo dei lavori</span><input id="ed-cant" data-f="cantiere" value="${esc(p.cantiere)}" placeholder="Se diverso da quello del cliente"></label>`:`<div><button class="btn sm ghost" data-act="showCant">+ I lavori sono in un altro indirizzo</button></div>`}
    </section>
    <section class="card" id="sec-lav">
      <div class="card-head"><span class="n">2</span><h2>Lavori</h2></div>
      ${(()=>{if(!p.clienteId||p.voci.length)return "";const last=sortP(S.preventivi.filter(q=>q.clienteId===p.clienteId&&q.id!==p.id&&(q.voci||[]).length))[0];return last?`<div class="banner"><div class="grow">Ultimo preventivo per questo cliente: <b>N. ${esc(last.numero)}</b> (${(last.voci||[]).length} lavori)</div><button class="btn sm primary" data-act="copyLast">Copia i lavori</button></div>`:""})()}
      <label class="field"><span>Descrizione dei lavori (facoltativa)</span><textarea id="ed-dl" data-f="descrLavori" rows="3" placeholder="Es. Tinteggiatura completa appartamento al 2° piano: soggiorno, cucina, 2 camere e corridoio">${esc(p.descrLavori||"")}</textarea></label>
      <label class="field"><span>Metri quadri totali (facoltativo)</span><div class="qty"><input id="ed-mq" class="num" data-f="mqTot" inputmode="decimal" value="${inVal(p.mqTot)}" placeholder="Es. 120"><span class="um" style="display:grid;place-items:center">mq</span></div></label>
      <p class="muted" style="margin:-6px 0 0;font-size:13px">Vale per tutti i lavori a mq: se lo scrivi qui, nelle voci non serve rimettere la quantità.</p>
      ${cfg().modelli.length?`<div class="sub">Modelli: un tocco, più lavori</div><div class="quick" aria-label="Modelli">${cfg().modelli.map((m,i)=>`<button class="tpl" data-act="useTpl" data-i="${i}">★ ${esc(m.nome)}</button>`).join("")}</div>`:""}
      <div class="sub">Lavori singoli${Object.keys(USE()).length?" · i più usati per primi":""}</div>
      <div class="quick" aria-label="Aggiungi dal listino">${(()=>{const u=USE();return L.map((l,i)=>[l,i]).sort((a,b)=>(u[b[0].id]||0)-(u[a[0].id]||0)||a[1]-b[1])})().map(([l,i])=>{const on=p.voci.some(v=>v.lid?v.lid===l.id:v.nome===l.nome);return `<button data-act="quickAdd" data-i="${i}" aria-pressed="${on}" class="${on?"on":""}">${on?"✓":"+"} ${esc(l.nome)}</button>`}).join("")}<button class="other" data-act="freeAdd">+ Altro</button></div>
      ${p.voci.map((v,i)=>voceHtml(v,i,p)).join("")}
      ${p.voci.filter(v=>v.lid).length>=2?(S.tplForm?`<div class="row"><input id="tplName" placeholder="Nome del modello, es. Bagno completo" style="flex:1"><button class="btn sm primary" data-act="saveTpl">Salva</button></div>`:`<div><button class="btn sm ghost" data-act="tplForm">★ Salva questi lavori come modello</button></div>`):""}
    </section>
    <section class="card" id="sec-pr">
      <div class="card-head"><span class="n">3</span><h2>Prezzo</h2></div>
      <div class="seg" role="group" aria-label="Come indicare il prezzo"><button data-act="modo" data-v="voci" aria-pressed="${!tot_}">Prezzo per lavoro</button><button data-act="modo" data-v="totale" aria-pressed="${tot_}">Solo il totale</button></div>
      ${tot_?`
        <label class="field"><span>Totale dei lavori</span><div class="bigin"><i>€</i><input id="ed-corpo" class="num" data-f="importoCorpo" inputmode="decimal" value="${inVal(p.importoCorpo)}" placeholder="0"></div></label>
        <div class="row between" style="flex-wrap:wrap">${ivaSel}${+p.iva?`<div class="seg" style="flex:1;min-width:200px"><button data-act="ivaInc" data-v="0" aria-pressed="${!p.ivaInclusa}">+ IVA</button><button data-act="ivaInc" data-v="1" aria-pressed="${!!p.ivaInclusa}">IVA già inclusa</button></div>`:""}</div>
        <div class="sum"><span>Imponibile</span><span class="r num" id="t-imp">${money(t.base)}</span><span>IVA</span><span class="r num" id="t-iva">${money(t.iva)}</span><hr><b>Totale</b><span class="r big num" id="t-tot">${money(t.totale)}</span></div>`
      :`<div class="sum">
        <span>Somma lavori</span><span class="r num" id="t-imp">${money(t.imp)}</span>
        <span class="inline">Sconto <input id="ed-sconto" data-f="sconto" inputmode="decimal" value="${inVal(p.sconto)}" placeholder="0" aria-label="Sconto"> <button type="button" class="umb" data-act="scTipo" aria-label="Sconto in percentuale o in euro: tocca per cambiare">${p.scontoTipo==="€"?"€":"%"}</button></span><span class="r num" id="t-sc">${t.sc?"− "+money(t.sc):"—"}</span>
        <span id="t-arl" ${t.ar?"":"hidden"}>Arrotondamento</span><span class="r num" id="t-ar" ${t.ar?"":"hidden"}>− ${money(t.ar)}</span>
        <span>${ivaSel}</span><span class="r num" id="t-iva">${money(t.iva)}</span>
        <hr><b>Totale</b><span class="r big num" id="t-tot">${money(t.totale)}</span></div>
        <label class="toggle"><input id="ed-tondo" type="checkbox" data-f="tondo" ${p.tondo?"checked":""}> Totale tondo (arrotonda per difetto a 10 o 50 €)</label>`}
      ${accOf(p)?`<div class="sum"><span class="inline">Acconto <input id="ed-acc" data-f="acconto" inputmode="decimal" value="${inVal(p.acconto)}" placeholder="0" aria-label="Acconto in percentuale"> % <button class="icon-btn" style="width:32px;height:32px" data-act="accX" aria-label="Togli acconto">${ICON_X}</button></span><span class="r num" id="t-acc">${money(t.totale*accOf(p)/100)}</span></div>`:`<div><button class="btn sm ghost" data-act="accAdd">+ Aggiungi acconto</button></div>`}
    </section>
    <section class="card" id="sec-note">
      <div class="card-head"><span class="n">4</span><h2>Note</h2></div>
      <div class="quick" aria-label="Note rapide">${cfg().noteRapide.map((n,i)=>{const on=String(p.note||"").split("\n").includes(n);return `<button data-act="noteChip" data-i="${i}" aria-pressed="${on}" class="${on?"on":""}">${on?"✓":"+"} ${esc(n)}</button>`}).join("")}</div>
      <textarea id="ed-note" data-f="note" rows="3" aria-label="Note per il cliente" placeholder="Colori scelti, accesso al cantiere…">${esc(p.note)}</textarea>

    <section class="card" id="sec-int">

    </section>
    <details class="more"><summary>Altre opzioni</summary><div class="in">
      <div class="grid2"><label class="field"><span>Data</span><input id="ed-data" data-f="data" type="date" value="${esc(p.data)}"></label>

      <label class="field"><span>Condizioni</span><textarea id="ed-cond" data-f="condizioni" rows="4">${esc(p.condizioni)}</textarea></label>
      ${p._new?"":`<div class="row" style="flex-wrap:wrap"><button class="btn" data-act="dupPrev">Duplica</button><button class="btn danger" data-act="delPrev">Elimina</button></div>`}
    </div></details>
  </div></div>
  <div class="sheet-foot">
    <div class="tot"><span class="label">Totale</span><b class="num" id="f-tot">${money(t.totale)}</b><small>${+p.iva?"IVA "+fmtQty(p.iva)+"% inclusa":"Senza IVA"} · salvataggio automatico</small></div>
    <button class="btn primary" data-act="pdf">Invia ➜</button>
  </div>`;
  const nb=ed.querySelector(".sheet-body");if(nb)nb.scrollTop=st;
  p.voci.forEach(v=>delete v._fresh);
  ed.querySelectorAll("input:not([type=checkbox])").forEach(i=>i.setAttribute("enterkeyhint","next"));

}

function onEdInput(e){
  const t=e.target,p=S.ed;if(!p)return;
  const f=t.dataset.f;if(!f)return;
  const vEl=t.closest("[data-vi]");
  if(vEl){const v=p.voci[+vEl.dataset.vi];if(f==="qty"||f==="prezzo")v[f]=num(t.value);else v[f]=t.value;
    const imp=vEl.querySelector("[data-imp]");if(imp)imp.textContent=money(qEff(v,p)*(+v.prezzo||0));
    if(f==="prezzo"){const vl=vEl.querySelector(".vlist");if(vl)vl.innerHTML=listinoBtn(v)}
    if(f==="um"){const lab=vEl.querySelector("[data-plab]");if(lab)lab.textContent="€ / "+v.um}}
  else if(f.startsWith("cliente.")){p.cliente[f.slice(8)]=t.value;
    if(f==="cliente.nome"){const nm=t.value.trim().toLowerCase();const c=nm&&S.clienti.find(x=>(x.nome||"").trim().toLowerCase()===nm);
      if(c&&p.clienteId!==c.id){p.clienteId=c.id;S.pickedId=c.id;p.cliente=clienteSnap(c);markDirty();renderEditor();$("#ed-tel")?.focus();toast("Cliente trovato: dati compilati");return}
      else if(!c&&p.clienteId&&p.clienteId===S.pickedId){p.clienteId=null;S.pickedId=null}
      updNav()}
    const ct=$("#contacts");if(ct)ct.innerHTML=contactBtns(p.cliente.tel,p.cantiere||p.cliente.indirizzo)}
  else if(f==="tondo"){p.tondo=t.checked}
  else if(f==="acconto")p.acconto=num(t.value);
  else if(f==="mqTot"){p.mqTot=num(t.value);document.querySelectorAll("#editor [data-vi]").forEach(el=>{const v=p.voci[+el.dataset.vi];const q=el.querySelector('[data-f="qty"]');if(q)q.placeholder=v.um==="mq"&&p.mqTot?fmtQty(p.mqTot):"0";const im=el.querySelector("[data-imp]");if(im)im.textContent=money(qEff(v,p)*(+v.prezzo||0))})}
  else if(f==="sconto"||f==="importoCorpo"||f==="costi")p[f]=num(t.value);
  else if(f==="iva"){p.iva=num(t.value);markDirty();renderEditor();return}
  else if(f==="validita")p[f]=parseInt(t.value)||0;
  else if(f==="cantiere"){p.cantiere=t.value;const ct=$("#contacts");if(ct)ct.innerHTML=contactBtns(p.cliente.tel,p.cantiere||p.cliente.indirizzo)}
  else p[f]=t.value;
  markDirty();updTotals();
}
function prevDoc(p){const doc=clone(p);delete doc._new;delete doc.id;doc.totale=Math.round(tot(p).totale*100)/100;doc.updatedAt=Date.now();Object.keys(doc).forEach(k=>(doc[k]===undefined||doc[k]===null)&&delete doc[k]);return doc}
function savePrev(silent){S.saveChain=(S.saveChain||Promise.resolve()).then(()=>doSave(silent));return S.saveChain}
async function doSave(silent){
  const p=S.ed;if(!p)return false;
  if(!p.cliente.nome.trim()){if(!silent){toast("Scrivi il nome del cliente");const n=$("#ed-nome");if(n){n.focus();n.scrollIntoView({block:"center"})}}return false}
  const ver=S.editVer;if(!silent)setStatus("Salvo…");
  try{
    const now=Date.now();const cl=clienteSnap(p.cliente);
    let ex=p.clienteId?S.clienti.find(c=>c.id===p.clienteId):S.clienti.find(c=>(c.nome||"").trim().toLowerCase()===cl.nome.toLowerCase());
    if(!p.clienteId)p.clienteId=ex?ex.id:uid();
    const cd={...(ex||{}),...cl,createdAt:ex?.createdAt||now,updatedAt:now};delete cd.id;
    await Store.set("clienti",p.clienteId,cd);
    if(p._new&&S.preventivi.some(x=>x.numero===p.numero&&x.id!==p.id))p.numero=nextNumero();
    p.cliente=cl;p.createdAt=p.createdAt||now;
    await Store.set("preventivi",p.id,prevDoc(p));
    p._new=false;
    if(S.ed===p&&S.editVer===ver){S.dirty=false;lsSet(DKEY,null);setStatus("Salvato",true)}
    if(!silent)toast("Salvato");return true;
  }catch(err){console.error(err);setStatus("Non salvato: controlla la connessione");if(!silent)toast("Non salvato: controlla la connessione e riprova");return false}
}

    case "openCliente":showCliente(S.clienti.find(c=>c.id===b.dataset.id));break;
    case "saveCliente":{const c=S.modalCtx.c;if(!c.nome.trim()){toast("Scrivi il nome");break}const now=Date.now();const d={...c,nome:c.nome.trim(),createdAt:c.createdAt||now,updatedAt:now};const id=d.id;delete d.id;try{await Store.set("clienti",id,d);hideModal();toast("Cliente salvato")}catch(err){toast("Salvataggio non riuscito")}break}
    case "newForCliente":{const c=S.clienti.find(x=>x.id===S.modalCtx.c.id);hideModal();openEditor(newPrev(c));break}
    case "delCliente":{const id=S.modalCtx.c.id;const n=S.preventivi.filter(p=>p.clienteId===id).length;if(n){toast("Ha "+n+" preventivi: elimina prima quelli");break}if(!armed(b,"Tocca di nuovo per eliminare"))break;await Store.del("clienti",id);hideModal();toast("Cliente eliminato");break}
    case "saveCfg":{const c=clone(S.cfgDraft);c.validita=parseInt(c.validita)||30;c.ivaDefault=+c.ivaDefault;c.acconto=num(c.acconto);if(typeof c.noteRapide==="string")c.noteRapide=c.noteRapide.split("\n").map(x=>x.trim()).filter(Boolean);try{await Store.setConfig(c);toast("Listino salvato")}catch(err){toast("Salvataggio non riuscito")}break}
    case "addLi":{S.cfgDraft.listino.push({id:uid(),nome:"",descr:"",um:"mq",prezzo:0});render();const l=S.cfgDraft.listino[S.cfgDraft.listino.length-1];const el=$("#li-n-"+l.id);if(el){el.placeholder="Nome del lavoro";el.focus()}break}
    case "exportBk":{const data={app:"argese-preventivi",v:1,at:new Date().toISOString(),clienti:S.clienti,preventivi:S.preventivi,config:S.config||cfg()};const name="Backup_Preventivi_"+todayISO()+".json";const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
      let shared=false;try{const f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});shared=true}}catch(err){if(err&&err.name==="AbortError")break}
      if(!shared){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
      lsSet("argese_last_bk",Date.now());render();toast("Backup pronto");break}
    case "rmLi":{const i=+b.closest("[data-li]").dataset.li;S.cfgDraft.listino.splice(i,1);render();break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;renderPList();return}
  if(t.id==="qc"){S.qc=t.value;renderCList();return}
  if(t.closest("#editor")){if(t.tagName!=="SELECT")onEdInput(e);return}
  if(t.dataset.k&&S.modalCtx?.type==="cliente"){S.modalCtx.c[t.dataset.k]=t.value;return}
  if(t.dataset.cfg&&S.cfgDraft&&t.tagName!=="SELECT"){S.cfgDraft[t.dataset.cfg]=t.value;return}
  if(t.dataset.lf&&S.cfgDraft&&t.tagName!=="SELECT"){const i=+t.closest("[data-li]").dataset.li;S.cfgDraft.listino[i][t.dataset.lf]=t.dataset.lf==="prezzo"?num(t.value):t.value}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.actChange==="pickCliente"&&S.ed){const c=S.clienti.find(x=>x.id===t.value);if(c){S.ed.clienteId=c.id;S.ed.cliente={nome:c.nome||"",tel:c.tel||"",indirizzo:c.indirizzo||""};markDirty();renderEditor()}return}
  if(t.tagName==="SELECT"&&t.closest("#editor")){onEdInput(e);return}
  if(t.id==="bkIn"&&t.files[0]){const f=t.files[0];t.value="";importBk(f);return}
  if(t.tagName==="SELECT"&&S.cfgDraft){if(t.dataset.cfg)S.cfgDraft[t.dataset.cfg]=t.value;if(t.dataset.lf)S.cfgDraft.listino[+t.closest("[data-li]").dataset.li][t.dataset.lf]=t.value}
});
async function importBk(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("File non valido");return}
  if(!d||d.app!=="argese-preventivi"){toast("Non è un backup di Argese Preventivi");return}
  let nc=0,np=0;
  for(const c of d.clienti||[]){const ex=S.clienti.find(x=>x.id===c.id);if(!ex||(c.updatedAt||0)>(ex.updatedAt||0)){const x={...c};delete x.id;await Store.set("clienti",c.id,x);nc++}}
  for(const p of d.preventivi||[]){const ex=S.preventivi.find(x=>x.id===p.id);if(!ex||(p.updatedAt||0)>(ex.updatedAt||0)){const x={...p};delete x.id;await Store.set("preventivi",p.id,x);np++}}
  if(d.config){const mine=cfg();await Store.setConfig({...mine,...d.config,firma:mine.firma,sigla:mine.sigla});S.cfgDraft=null}
  render();toast("Importati: "+np+" preventivi, "+nc+" clienti e il listino");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)hideModal();
  const t=e.target;if(e.key==="Enter"&&t.tagName==="INPUT"&&t.closest("#editor")&&t.type!=="checkbox"&&!t.list){e.preventDefault();const all=[...document.querySelectorAll("#editor input:not([type=checkbox]),#editor textarea")].filter(x=>x.offsetParent);const i=all.indexOf(t);if(i>=0&&all[i+1])all[i+1].focus();else t.blur()}
  else if(e.key==="Enter"&&t.id==="ed-nome"){e.preventDefault();$(S.ed&&isAz(S.ed.cliente)?"#ed-piva":"#ed-tel")?.focus()}});
document.addEventListener("focusin",e=>{const t=e.target;if(t.matches&&t.matches('#editor input[inputmode="decimal"]'))setTimeout(()=>{try{t.select()}catch(err){}},0)});
document.addEventListener("focusout",e=>{if(e.target.id==="ed-nome"&&S.dirty)scheduleSave()});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")hideModal()});
$("#toast").addEventListener("click",e=>{if(e.target.classList.contains("tbtn")&&toastFn){const f=toastFn;toastFn=null;$("#toast").hidden=true;f()}});

if(IS_PWA){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{try{r.update()}catch(e){}}).catch(()=>{}))}
render();
Store.init().catch(err=>{console.error(err);Store.mode="local";S.ready=true;render()});
</script>

</body>
</html>
